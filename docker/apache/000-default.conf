<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        Options Multiviews Indexes FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !(\.css|\.js|\.png|\.jpg|\.gif|\.map|robots\.txt|\.ico)$ [NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^.*$ /index.php [L,QSA]
    </Directory>

    <IfModule mod_headers.c>
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-Content-Type-Options "nosniff"
        Header unset X-Powered-By
        Header set Content-Security-Policy "frame-ancestors 'self' default-src 'self' script-src 'self' style-src 'self' img-src 'self' frame-src 'self' font-src 'self' media-src 'self' object-src 'self' manifest-src 'self' worker-src 'self' form-action 'self'"
        Header set Permissions-Policy "accelerometer=(), geolocation=('self'), fullscreen=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=('self')"
        Header set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
